<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="60%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#0f291e"/>
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="goldSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#052e16" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#22c55e" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="#22c55e" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- Golden Sun / Harvest Dawn -->
  <circle cx="256" cy="180" r="54" fill="url(#goldSun)" filter="url(#glow)"/>

  <!-- Primary Leaf Structure & Stem (KrishiSetu bridge) -->
  <g filter="url(#glow)">
    <!-- Bridge Arch Stem -->
    <path d="M170 380 C 210 330, 256 310, 256 220" fill="none" stroke="#86efac" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Right Vibrant Sprout Leaf -->
    <path d="M256 220 C 330 190, 390 230, 380 290 C 340 330, 280 300, 256 240 Z" fill="url(#leafGrad1)"/>
    
    <!-- Left Mature Crop Leaf -->
    <path d="M256 245 C 190 220, 140 260, 150 320 C 190 350, 240 310, 256 265 Z" fill="url(#leafGrad2)"/>
    
    <!-- Central Shoot -->
    <path d="M256 220 C 250 170, 256 130, 256 120 C 262 130, 268 170, 256 220 Z" fill="#bbf7d0"/>
  </g>

  <!-- Base Fertile Soil Arc -->
  <path d="M120 400 Q 256 430 392 400" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M160 420 Q 256 445 352 420" fill="none" stroke="#facc15" stroke-width="5" stroke-linecap="round" stroke-opacity="0.7"/>
</svg>
